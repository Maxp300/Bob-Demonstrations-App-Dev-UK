version: '3.8'

services:
  # DISCREPANCY #15: Using MongoDB instead of relational database
  # Design specifies relational database (PostgreSQL/MySQL)
  mongodb:
    image: mongo:5.0
    container_name: electrify-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongodb_data:/data/db
    networks:
      - electrify-network

  # Backend service
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: electrify-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://admin:password123@mongodb:27017/electrify
      # DISCREPANCY #16: Missing Auth0 environment variables
      # Should have: AUTH0_DOMAIN, AUTH0_CLIENT_ID, AUTH0_CLIENT_SECRET, AUTH0_AUDIENCE
    depends_on:
      - mongodb
    networks:
      - electrify-network

  # Frontend service
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: electrify-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8080
      # DISCREPANCY #17: Missing Auth0 frontend configuration
      # Should have: REACT_APP_AUTH0_DOMAIN, REACT_APP_AUTH0_CLIENT_ID
    depends_on:
      - backend
    networks:
      - electrify-network

  # DISCREPANCY #18: Missing API Gateway service
  # Design specifies API Gateway as single entry point for authentication
  # Current implementation has no API Gateway

volumes:
  mongodb_data:

networks:
  electrify-network:
    driver: bridge

