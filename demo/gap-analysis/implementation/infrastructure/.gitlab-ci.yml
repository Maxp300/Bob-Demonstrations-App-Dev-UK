# Build stage - partially implemented
build-backend:
  stage: build
  image: maven:3.8-openjdk-11
  script:
    - echo "Building backend services..."
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 hour
  only:
    - main
    - develop

